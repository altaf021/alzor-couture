<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ error_title or 'Page Not Found' }} — Alzor Couture</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .error-stage {
            min-height: 75vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px 24px;
            background: #0f0d0c;
            color: #f7f4ee;
            text-align: center;
        }
        .error-card {
            max-width: 580px;
            padding: 48px 36px;
            border: 1px solid rgba(173, 138, 81, 0.35);
            background: rgba(20, 18, 16, 0.85);
            backdrop-filter: blur(8px);
        }
        .error-tag {
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #ad8a51;
            margin-bottom: 16px;
            display: block;
        }
        .error-title {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 34px;
            font-weight: 300;
            letter-spacing: 1.5px;
            color: #ffffff;
            margin-bottom: 16px;
            line-height: 1.25;
        }
        .error-desc {
            font-size: 14px;
            line-height: 1.8;
            color: #b3aca0;
            margin-bottom: 32px;
        }
        .error-actions {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-gold {
            background: #ad8a51;
            color: #141210;
            padding: 13px 28px;
            text-decoration: none;
            font-size: 11px;
            letter-spacing: 2.2px;
            text-transform: uppercase;
            font-weight: 700;
            transition: all 0.3s ease;
            display: inline-block;
        }
        .btn-gold:hover {
            background: #ffffff;
            color: #141210;
        }
        .btn-outline {
            border: 1px solid rgba(173, 138, 81, 0.6);
            color: #f7f4ee;
            padding: 13px 28px;
            text-decoration: none;
            font-size: 11px;
            letter-spacing: 2.2px;
            text-transform: uppercase;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-block;
        }
        .btn-outline:hover {
            border-color: #ffffff;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="error-stage">
        <div class="error-card">
            <span class="error-tag">ALZOR COUTURE &bull; ATELIER</span>
            <h1 class="error-title">{{ error_title or 'PIECE NOT FOUND' }}</h1>
            <p class="error-desc">{{ error_message or 'The silhouette or destination you requested is no longer in our active salon. Discover our latest couture co-ord sets and evening arrivals.' }}</p>
            <div class="error-actions">
                <a href="/" class="btn-gold">Return to Salon</a>
                <a href="/co-ord-sets" class="btn-outline">Explore Co-ord Sets</a>
            </div>
        </div>
    </div>
</body>
</html>
