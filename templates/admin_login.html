<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atelier Administration Access — Alzor Couture</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
    <style>
        :root {
            --gold: #ad8a51;
            --dark: #12100e;
            --card-bg: #1a1715;
            --border: rgba(173, 138, 81, 0.3);
            --text: #eae5dc;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--dark);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .login-box {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 44px 36px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            text-align: center;
        }
        .brand-logo {
            width: 64px;
            height: 64px;
            object-fit: contain;
            margin-bottom: 16px;
        }
        .tag {
            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--gold);
            font-weight: 700;
            margin-bottom: 8px;
            display: block;
        }
        h1 {
            font-family: Georgia, serif;
            font-size: 24px;
            font-weight: 400;
            letter-spacing: 1px;
            color: #ffffff;
            margin-bottom: 24px;
        }
        .error-banner {
            background: rgba(220, 53, 69, 0.15);
            border: 1px solid rgba(220, 53, 69, 0.5);
            color: #ff8b8b;
            font-size: 13px;
            padding: 10px 14px;
            margin-bottom: 20px;
            text-align: left;
        }
        .field {
            text-align: left;
            margin-bottom: 24px;
        }
        label {
            display: block;
            font-size: 11px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #a49e95;
            margin-bottom: 8px;
            font-weight: 600;
        }
        input[type="password"] {
            width: 100%;
            background: #0f0d0c;
            border: 1px solid var(--border);
            padding: 13px 16px;
            color: #ffffff;
            font-size: 15px;
            letter-spacing: 2px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="password"]:focus {
            border-color: var(--gold);
        }
        .btn-submit {
            width: 100%;
            background: var(--gold);
            color: #12100e;
            border: none;
            padding: 14px;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-submit:hover {
            background: #d4b06f;
        }
        .footer-note {
            margin-top: 24px;
            font-size: 11px;
            color: #7a746b;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Alzor Logo" class="brand-logo">
        <span class="tag">AUTHORIZED PORTAL</span>
        <h1>Atelier Administration</h1>

        {% if error %}
        <div class="error-banner">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('admin_login') }}">
            <div class="field">
                <label for="password">Administrator Passcode</label>
                <input type="password" id="password" name="password" required autofocus placeholder="Enter admin passcode">
            </div>
            <button type="submit" class="btn-submit">Authenticate Session</button>
        </form>

        <p class="footer-note">Confidential management console for Alzor Couture order operations.</p>
    </div>
</body>
</html>
